name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt ruff

      - name: Check Python syntax
        run: python -m compileall -q app tests

      - name: Run Ruff lint
        run: python -m ruff check app tests

      - name: Run tests
        env:
          OPENWEATHER_API_KEY: ci-test-key
        run: python -m pytest tests -q

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Build Next.js application
        env:
          BACKEND_API_BASE_URL: http://localhost:8000/api/v1
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend, frontend]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --tag agriyield-backend:ci ./backend

      - name: Build frontend image
        run: docker build --tag agriyield-frontend:ci ./frontend

  ci:
    name: Required CI gate
    if: always()
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker]
    steps:
      - name: Fail if any required job failed
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        run: |
          test "$BACKEND_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$DOCKER_RESULT" = success