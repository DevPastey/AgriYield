services:
  # Backend Service
  - type: web
    name: AgriYield-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production

  # Frontend Service
  - type: web
    name: AgriYield-frontend
    env: docker
    dockerfilePath: frontend/Dockerfile
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: AgriYield-backend
          property: url
